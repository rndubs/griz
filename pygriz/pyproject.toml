[project]
name = "llnl-griz"
version = "0.1.0"
description = "Python interface to the Griz visualization engine"
readme = "README.md"
authors = [
    { name = "Ryan Whitmore", email = "whitmore5@llnl.gov" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griz"]

[tool.uv]
native-tls = true

