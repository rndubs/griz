[project]
name = "llnl-griz"
version = "0.1.0"
description = "Python interface to the Griz visualization engine"
readme = "README.md"
authors = [
    { name = "Ryan Whitmore", email = "whitmore5@llnl.gov" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griz"]

# The shared results map lives at ../Src/data/results_map.yaml and is
# symlinked into src/griz/data/. Hatch follows the symlink and embeds the
# file contents in the wheel, so installed copies ship the real YAML.
[tool.hatch.build.targets.wheel.force-include]
"src/griz/data/results_map.yaml" = "griz/data/results_map.yaml"

[tool.uv]
native-tls = true

