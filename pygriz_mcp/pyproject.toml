[project]
name = "llnl-griz-mcp"
version = "0.1.0"
description = "MCP server adapter for the Griz visualization engine"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "llnl-griz>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
griz-mcp = "griz_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griz_mcp"]

[tool.uv]
native-tls = true

[tool.uv.sources]
llnl-griz = { path = "../pygriz", editable = true }
